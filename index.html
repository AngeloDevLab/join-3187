<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="./public/icons/favicon.svg">
    <title>Join | Log in</title>
    <link rel="stylesheet" href="src/styles/variables.css">
    <link rel="stylesheet" href="src/styles/base.css">
    <link rel="stylesheet" href="src/styles/buttons.css">
    <link rel="stylesheet" href="src/styles/inputs.css">
    <link rel="stylesheet" href="src/styles/modal.css">
    <link rel="stylesheet" href="src/pages/auth/auth.css">

    <script type="module" src="src/pages/auth/auth.js"></script>
</head>

<body class="is-dark">
    <div class="intro" id="intro" aria-hidden="true">
        <div class="intro-logo">
            <img src="./public/icons/join_logo.svg" alt="" class="intro-logo-img intro-logo-img-light">
            <img src="./public/icons/favicon.svg" alt="" class="intro-logo-img intro-logo-img-dark">
        </div>
    </div>

    <div class="page max-content">
        <header class="page-header">
            <img src="./public/icons/favicon.svg" alt="Join" class="page-logo page-logo-dark">
            <img src="./public/icons/join_logo.svg" alt="Join" class="page-logo page-logo-light">

            <p class="signup-hint signup-hint-header" id="signupHintHeader">
                Not a Join user? <button type="button" class="btn btn-primary" data-show-auth="signup">Sign up</button>
            </p>
        </header>

        <main class="auth">
            <div class="auth-view role-view" id="roleView">
                <p class="signup-hint signup-hint-light">
                    Not a Join user? <button type="button" class="signup-link" data-show-auth="signup">Sign up</button>
                </p>

                <section class="auth-card role-card">
                    <h1 class="auth-title role-title">Welcome</h1>
                    <p class="role-intro">
                        Pick the option that suits your role:
                        create a request as a stakeholder or log in if you’re part of the team.
                    </p>

                    <div class="role-options">
                        <div class="role-option">
                            <p class="role-option-label">
                                <img src="./public/icons/work.svg" alt="" class="role-icon">
                                Are you a stakeholder?
                            </p>
                            <button type="button" class="btn btn-primary" id="createRequestBtn">Create request</button>
                        </div>
                        <div class="role-option">
                            <p class="role-option-label">
                                <img src="./public/icons/group.svg" alt="" class="role-icon role-icon-group">
                                Are you a team member?
                            </p>
                            <button type="button" class="btn btn-secondary" data-show-auth="login">Member log in</button>
                        </div>
                    </div>
                </section>
            </div>

            <div class="auth-view is-hidden" id="loginView">
                <section class="auth-card auth-card-login" id="loginCard">
                    <h1 class="auth-title">Log in</h1>

                    <form class="auth-form" id="loginForm" novalidate>
                        <div class="input-field">
                            <div class="input-wrapper">
                                <input type="email" id="loginEmail" name="email" placeholder="Email" autocomplete="email" required>
                                <img src="./public/icons/mail.svg" alt="" class="input-icon">
                            </div>
                            <p class="input-error-msg" id="loginEmailError"></p>
                        </div>
                        <div class="input-field">
                            <div class="input-wrapper">
                                <input type="password" id="loginPassword" name="password" placeholder="Password" autocomplete="current-password" required>
                                <button type="button" class="input-icon-btn" aria-label="Show password" disabled>
                                    <img src="./public/icons/lock.svg" alt="">
                                </button>
                            </div>
                            <p class="input-error-msg" id="loginPasswordError"></p>
                        </div>

                        <div class="auth-buttons">
                            <button type="submit" class="btn btn-primary">Log in</button>
                            <button type="button" class="btn btn-secondary" id="guestLoginBtn">Guest Log in</button>
                        </div>
                    </form>
                </section>

                <p class="signup-hint signup-hint-card">
                    Not a Join user? <button type="button" class="btn btn-primary" data-show-auth="signup">Sign up</button>
                </p>
            </div>

            <section class="auth-card auth-card-signup is-hidden" id="signupCard">
                <div class="auth-card-head">
                    <button type="button" class="close-btn" data-show-auth="login" aria-label="Back to log in">
                        <img src="./public/icons/arrow-left.svg" alt="">
                    </button>
                    <h1 class="auth-title">Sign up</h1>
                </div>

                <form class="auth-form" id="signupForm" novalidate>
                    <div class="input-field">
                        <div class="input-wrapper">
                            <input type="text" id="signupName" name="name" placeholder="Name" autocomplete="name" required>
                            <img src="./public/icons/person.svg" alt="" class="input-icon">
                        </div>
                        <p class="input-error-msg" id="signupNameError"></p>
                    </div>

                    <div class="input-field">
                        <div class="input-wrapper">
                            <input type="email" id="signupEmail" name="email" placeholder="Email" autocomplete="email" required>
                            <img src="./public/icons/mail.svg" alt="" class="input-icon">
                        </div>
                        <p class="input-error-msg" id="signupEmailError"></p>
                    </div>

                    <div class="input-field">
                        <div class="input-wrapper">
                            <input type="password" id="signupPassword" placeholder="Password" autocomplete="new-password" required>
                            <button type="button" class="input-icon-btn" aria-label="Show password" disabled>
                                <img src="./public/icons/lock.svg" alt="">
                            </button>
                        </div>
                        <p class="input-error-msg" id="signupPasswordError"></p>
                    </div>

                    <div class="input-field">
                        <div class="input-wrapper">
                            <input type="password" id="signupConfirm" placeholder="Confirm Password" autocomplete="new-password" required>
                            <button type="button" class="input-icon-btn" aria-label="Show password" disabled>
                                <img src="./public/icons/lock.svg" alt="">
                            </button>
                        </div>
                        <p class="input-error-msg" id="signupConfirmError"></p>
                    </div>

                    <div class="input-field checkbox">
                        <label class="checkbox">
                            <input type="checkbox" id="signupPrivacy" name="privacy" class="checkbox-input" required>
                            <span class="checkbox-icon" aria-hidden="true"></span>
                            I accept the <a href="./src/pages/legal/privacy.html">Privacy policy</a>
                        </label>
                        <p class="input-error-msg" id="signupCheckboxError"></p>
                    </div>

                    <div class="auth-buttons">
                        <button type="submit" class="btn btn-primary">Sign up</button>
                    </div>
                </form>
            </section>
        </main>

        <footer class="page-footer">
            <a href="./src/pages/legal/privacy.html">Privacy Policy</a>
            <a href="./src/pages/legal/imprint.html">Legal notice</a>
        </footer>
    </div>

</body>

</html>
